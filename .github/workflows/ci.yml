name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kujo-ssg
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Checkout Kujo runtime
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: kujolang/kujo
          path: kujo-runtime

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run repo CI checks
        env:
          KUJO_RUNTIME_DIR: ${{ github.workspace }}/kujo-runtime
        run: bash scripts/run_ci_checks.sh