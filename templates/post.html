<main class="container max-w-2xl m-auto py-10 px-4" id="main-content">
	<article class="prose dark:prose-dark max-w-none kujo-content">
		<h1 class="text-6xl font-bold mb-4 text-links font-heading-bold post-title">{{title}}</h1>
		{{featured_image_html}}
		<p class="text-2md post-meta mb-4 pb-2 text-accent italic border-b border-primary"><span class="date">{{date}}</span> &middot; <span class="author">{{author}}</span></p>
		<div class="category-row">{{categories_html}}</div>
		<div class="tag-row">{{tags_html}}</div>
		{{taxonomies_html}}
		{{body}}
	</article>
</main>
