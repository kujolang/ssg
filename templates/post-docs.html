<main class="docs-shell" id="main-content">
	<aside class="docs-sidebar" aria-label="Documentation sections">
		<ul>{{navigation}}</ul>
	</aside>
	<article class="docs-article">
		<p class="docs-eyebrow">{{section}}</p>
		<h1>{{title}}</h1>
		<p class="docs-description">{{description}}</p>
		{{docs_meta_html}}
		{{featured_image_html}}
		<section class="docs-prerequisites" aria-label="Prerequisites">
			<h2>Prerequisites</h2>
			{{prerequisites_html}}
		</section>
		<div class="category-row">{{categories_html}}</div>
		<div class="tag-row">{{tags_html}}</div>
		{{taxonomies_html}}
		<div class="docs-body">
			{{body}}
		</div>
		{{prev_next_html}}
	</article>
	{{toc}}
</main>
